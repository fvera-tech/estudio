<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>To-do List</title>
</head>

<body>
    <header>
        <h1>Lista de tareas</h1>
    </header>

    <main>
        <section>
            <form>
                <fieldset>
                    <label for="agregar">Agrega tu tarea</label>
                    <input class="text" type="text" id="agregar" placeholder="¿Qué tienes que hacer?">
                    <input class="button" type="button" value="Agregar">
                </fieldset>
            </form>

        </section>

        <section class="tareas-asignadas">
            <h2>Tareas por completar</h2>

            <ul>
                <li>
                    Tarea con texto muy largo para probar si la caja se mueve. Aja
                    <div class="btns">
                        <button class="delete">❌ Eliminar</button>
                        <button class="complete">✅ Completada</button>
                    </div>
                </li>
                <li>
                    Tarea 2
                    <div class="btns">
                        <button class="delete">❌ Eliminar</button>
                        <button class="complete">✅ Completada</button>
                    </div>
                </li>
            </ul>
        </section>

    </main>

    <footer>
        <h3>Soy el footer del proyecto!</h3>
    </footer>

    <script src="script.js"></script>
</body>

</html>
